# DHL Parcel NL automation examples (Polish default)
# Language-specific versions:
# - automation-examples-pl.yaml
# - automation-examples-en.yaml
# - automation-examples-nl.yaml
# Podmień encje TTS/media na swoje.
#
# Składnia wyzwalacza (encje event, Home Assistant 2026.x):
#   - trigger: event.received
#     target:
#       entity_id: event.dhl_parcel_netherlands_dhl_parcel_status_changed
#     options:
#       event_type: dhl_parcel_status_changed
# Dane zdarzenia są dostępne w trigger.to_state.attributes.
#
# Alternatywa niezależna od wersji HA (klasyczny wyzwalacz zdarzenia):
#   - trigger: event
#     event_type: dhl_parcel_status_changed
# Dane zdarzenia są wtedy dostępne w trigger.event.data.

# A0) Wykryto nową paczkę
- alias: "DHL - nowa paczka (PL)"
  id: dhl_parcel_discovered_pl
  mode: queued
  max_exceeded: silent
  triggers:
    - trigger: event.received
      target:
        entity_id: event.dhl_parcel_netherlands_dhl_parcel_discovered
      options:
        event_type: dhl_parcel_discovered
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.get('source') != 'amazon' }}"
    - condition: template
      value_template: "{{ trigger.to_state.attributes.get('status') != 'DELIVERED' }}"
  actions:
    - variables:
        carrier: "{{ {'dhl': 'DHL', 'postnl': 'PostNL', 'dragonfly': 'Dragonfly'}.get(trigger.to_state.attributes.get('carrier'), 'DHL') }}"
        sender: "{{ trigger.to_state.attributes.get('sender') or 'nieznanego nadawcy' }}"
        tracking: "{{ trigger.to_state.attributes.get('tracking_code', 'nieznany') }}"
        status: "{{ trigger.to_state.attributes.get('status_localized') or trigger.to_state.attributes.get('status') or 'nieznany' }}"
    - action: tts.speak
      target:
        entity_id: tts.piper_2
      data:
        cache: false
        media_player_entity_id: media_player.office
        message: "Wykryto nową paczkę {{ carrier }} {{ tracking }} od {{ sender }}. Aktualny status: {{ status }}."

# A) Zmiana statusu (doręczenie ogłasza automatyzacja C)
- alias: "DHL - zmiana statusu (PL)"
  id: dhl_status_changed_pl
  mode: queued
  max_exceeded: silent
  triggers:
    - trigger: event.received
      target:
        entity_id: event.dhl_parcel_netherlands_dhl_parcel_status_changed
      options:
        event_type: dhl_parcel_status_changed
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.get('new_status') != 'DELIVERED' }}"
  actions:
    - variables:
        carrier: "{{ {'dhl': 'DHL', 'postnl': 'PostNL', 'dragonfly': 'Dragonfly'}.get(trigger.to_state.attributes.get('carrier'), 'DHL') }}"
        sender: "{{ trigger.to_state.attributes.get('sender') or 'nieznanego nadawcy' }}"
        tracking: "{{ trigger.to_state.attributes.get('tracking_code', 'nieznany') }}"
        new_status: "{{ trigger.to_state.attributes.get('new_status_localized') or trigger.to_state.attributes.get('new_status') or 'nieznany' }}"
    - action: tts.speak
      target:
        entity_id: tts.piper_2
      data:
        cache: false
        media_player_entity_id: media_player.office
        message: >-
          Paczka {{ carrier }} {{ tracking }} od {{ sender }} zmieniła status na {{ new_status }}.
          {% if trigger.to_state.attributes.get('new_status') == 'READY_FOR_PICKUP' and trigger.to_state.attributes.get('delivery_location') %}Adres punktu odbioru: {{ trigger.to_state.attributes.get('delivery_location') }}.{% endif %}

# B) Zmiana okna doręczenia (godziny w strefie czasowej Home Assistant)
- alias: "DHL - okno doręczenia (PL)"
  id: dhl_delivery_window_pl
  mode: queued
  max_exceeded: silent
  triggers:
    - trigger: event.received
      target:
        entity_id: event.dhl_parcel_netherlands_dhl_parcel_delivery_window_changed
      options:
        event_type: dhl_parcel_delivery_window_changed
  actions:
    - variables:
        carrier: "{{ {'dhl': 'DHL', 'postnl': 'PostNL', 'dragonfly': 'Dragonfly'}.get(trigger.to_state.attributes.get('carrier'), 'DHL') }}"
        sender: "{{ trigger.to_state.attributes.get('sender') or 'nieznanego nadawcy' }}"
        tf_raw: "{{ trigger.to_state.attributes.get('new_delivery_timeframe') }}"
        tf_from_iso: >-
          {% if tf_raw is string and '/' in tf_raw %}{{ tf_raw.split('/')[0] }}{% elif tf_raw is mapping %}{{ tf_raw.get('from') or '' }}{% endif %}
        tf_to_iso: >-
          {% if tf_raw is string and '/' in tf_raw %}{{ tf_raw.split('/')[1] }}{% elif tf_raw is mapping %}{{ tf_raw.get('to') or '' }}{% endif %}
        from_time: >-
          {% set d = as_datetime(tf_from_iso, None) %}{{ (d | as_local).strftime('%H:%M') if d else 'nieznana' }}
        to_time: >-
          {% set d = as_datetime(tf_to_iso, None) %}{{ (d | as_local).strftime('%H:%M') if d else 'nieznana' }}
        day_label: >-
          {% set d = as_datetime(tf_from_iso, None) %}
          {% if d %}
            {% set diff = ((d | as_local).date() - now().date()).days %}
            {% if diff == 0 %}dzisiaj{% elif diff == 1 %}jutro{% elif diff == 2 %}pojutrze{% else %}{{ (d | as_local).strftime('%d.%m') }}{% endif %}
          {% else %}wkrótce{% endif %}
    - action: tts.speak
      target:
        entity_id: tts.piper_2
      data:
        cache: false
        media_player_entity_id: media_player.office
        message: "Paczka {{ carrier }} od {{ sender }} będzie doręczana {{ day_label }} między {{ from_time }} a {{ to_time }}."

# C) Doręczona
# Zdarzenia są wysyłane po aktualizacji sensorów, więc sensor.dhl_delivered_details
# zawiera już doręczoną paczkę w chwili uruchomienia automatyzacji.
- alias: "DHL - doręczona (PL)"
  id: dhl_delivered_pl
  mode: queued
  max_exceeded: silent
  triggers:
    - trigger: event.received
      target:
        entity_id: event.dhl_parcel_netherlands_dhl_parcel_status_changed
      options:
        event_type: dhl_parcel_status_changed
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.get('new_status') == 'DELIVERED' }}"
  actions:
    - variables:
        carrier: "{{ {'dhl': 'DHL', 'postnl': 'PostNL', 'dragonfly': 'Dragonfly'}.get(trigger.to_state.attributes.get('carrier'), 'DHL') }}"
        sender: "{{ trigger.to_state.attributes.get('sender') or 'nieznanego nadawcy' }}"
        tracking: "{{ trigger.to_state.attributes.get('tracking_code', 'nieznany') }}"
        delivery_location: "{{ trigger.to_state.attributes.get('delivery_location') or 'brak danych' }}"
        details: "{{ (state_attr('sensor.dhl_delivered_details', 'delivered_by_number') or {}).get(tracking, {}) }}"
        delivered_day: "{{ details.get('delivered_day_label') or 'niedawno' }}"
        delivered_time: >-
          {% set d = as_datetime(trigger.to_state.attributes.get('delivered_at') or '', None) %}{{ details.get('delivered_at_hhmm') or ((d | as_local).strftime('%H:%M') if d else '') }}
    - action: tts.speak
      target:
        entity_id: tts.piper_2
      data:
        cache: false
        media_player_entity_id: media_player.office
        message: >-
          Paczka {{ carrier }} {{ tracking }} od {{ sender }} została doręczona {{ delivered_day }}{% if delivered_time %} o {{ delivered_time }}{% endif %}.
          Lokalizacja doręczenia: {{ delivery_location }}.

# D) Zmiana etapu (substatus) - opcjonalnie, bardziej szczegółowe komunikaty
- alias: "DHL - zmiana etapu (PL)"
  id: dhl_substatus_changed_pl
  mode: queued
  max_exceeded: silent
  triggers:
    - trigger: event.received
      target:
        entity_id: event.dhl_parcel_netherlands_dhl_parcel_substatus_changed
      options:
        event_type: dhl_parcel_substatus_changed
  conditions:
    # Pomiń, gdy ta sama aktualizacja zmieniła też główny status (ogłaszają to A/C).
    - condition: template
      value_template: "{{ not trigger.to_state.attributes.get('status_changed') }}"
  actions:
    - variables:
        carrier: "{{ {'dhl': 'DHL', 'postnl': 'PostNL', 'dragonfly': 'Dragonfly'}.get(trigger.to_state.attributes.get('carrier'), 'DHL') }}"
        sender: "{{ trigger.to_state.attributes.get('sender') or 'nieznanego nadawcy' }}"
        tracking: "{{ trigger.to_state.attributes.get('tracking_code', 'nieznany') }}"
        new_substatus: "{{ trigger.to_state.attributes.get('new_substatus_localized') or trigger.to_state.attributes.get('new_substatus') or 'nieznany' }}"
    - action: tts.speak
      target:
        entity_id: tts.piper_2
      data:
        cache: false
        media_player_entity_id: media_player.office
        message: "Paczka {{ carrier }} {{ tracking }} od {{ sender }} ma nowy etap: {{ new_substatus }}."

# E) Pomocnik dla asystenta głosowego (przykład template sensor)
# Wklej do konfiguracji integracji template, aby udostępnić zwięzły opis dla asystenta AI.
# Gotowe podsumowanie jest też dostępne w sensor.dhl_parcel_voice_summary.
