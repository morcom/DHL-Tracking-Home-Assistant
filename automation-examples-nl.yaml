# DHL Parcel NL automatiseringsvoorbeelden (Home Assistant 2026) - Nederlands
# Vervang TTS/media entiteiten door je eigen entiteiten.
#
# Trigger-syntax (event-entiteiten, Home Assistant 2026.x):
#   - trigger: event.received
#     target:
#       entity_id: event.dhl_parcel_netherlands_dhl_parcel_status_changed
#     options:
#       event_type: dhl_parcel_status_changed
# De eventgegevens staan in trigger.to_state.attributes.
#
# Versie-onafhankelijk alternatief (klassieke event-trigger):
#   - trigger: event
#     event_type: dhl_parcel_status_changed
# De eventgegevens staan dan in trigger.event.data.

# A0) Nieuw pakket gedetecteerd
- alias: "DHL - nieuw pakket (NL)"
  id: dhl_parcel_discovered_nl
  mode: queued
  max_exceeded: silent
  triggers:
    - trigger: event.received
      target:
        entity_id: event.dhl_parcel_netherlands_dhl_parcel_discovered
      options:
        event_type: dhl_parcel_discovered
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.get('source') != 'amazon' }}"
    - condition: template
      value_template: "{{ trigger.to_state.attributes.get('status') != 'DELIVERED' }}"
  actions:
    - variables:
        carrier: "{{ {'dhl': 'DHL', 'postnl': 'PostNL', 'dragonfly': 'Dragonfly'}.get(trigger.to_state.attributes.get('carrier'), 'DHL') }}"
        sender: "{{ trigger.to_state.attributes.get('sender') or 'onbekende afzender' }}"
        tracking: "{{ trigger.to_state.attributes.get('tracking_code', 'onbekend') }}"
        status: "{{ trigger.to_state.attributes.get('status_localized') or trigger.to_state.attributes.get('status') or 'onbekend' }}"
    - action: tts.speak
      target:
        entity_id: tts.home_assistant_cloud
      data:
        cache: false
        media_player_entity_id: media_player.living_room
        message: "Nieuw {{ carrier }}-pakket {{ tracking }} van {{ sender }}. Huidige status: {{ status }}."

# A) Status gewijzigd (bezorging wordt gemeld door automatisering C)
- alias: "DHL - status gewijzigd (NL)"
  id: dhl_status_changed_nl
  mode: queued
  max_exceeded: silent
  triggers:
    - trigger: event.received
      target:
        entity_id: event.dhl_parcel_netherlands_dhl_parcel_status_changed
      options:
        event_type: dhl_parcel_status_changed
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.get('new_status') != 'DELIVERED' }}"
  actions:
    - variables:
        carrier: "{{ {'dhl': 'DHL', 'postnl': 'PostNL', 'dragonfly': 'Dragonfly'}.get(trigger.to_state.attributes.get('carrier'), 'DHL') }}"
        sender: "{{ trigger.to_state.attributes.get('sender') or 'onbekende afzender' }}"
        tracking: "{{ trigger.to_state.attributes.get('tracking_code', 'onbekend') }}"
        new_status: "{{ trigger.to_state.attributes.get('new_status_localized') or trigger.to_state.attributes.get('new_status') or 'onbekend' }}"
    - action: tts.speak
      target:
        entity_id: tts.home_assistant_cloud
      data:
        cache: false
        media_player_entity_id: media_player.living_room
        message: >-
          {{ carrier }}-pakket {{ tracking }} van {{ sender }} heeft nu status {{ new_status }}.
          {% if trigger.to_state.attributes.get('new_status') == 'READY_FOR_PICKUP' and trigger.to_state.attributes.get('delivery_location') %}Ophaaladres: {{ trigger.to_state.attributes.get('delivery_location') }}.{% endif %}

# B) Leveringsvenster gewijzigd (tijden in de tijdzone van Home Assistant)
- alias: "DHL - leveringsvenster (NL)"
  id: dhl_delivery_window_nl
  mode: queued
  max_exceeded: silent
  triggers:
    - trigger: event.received
      target:
        entity_id: event.dhl_parcel_netherlands_dhl_parcel_delivery_window_changed
      options:
        event_type: dhl_parcel_delivery_window_changed
  actions:
    - variables:
        carrier: "{{ {'dhl': 'DHL', 'postnl': 'PostNL', 'dragonfly': 'Dragonfly'}.get(trigger.to_state.attributes.get('carrier'), 'DHL') }}"
        sender: "{{ trigger.to_state.attributes.get('sender') or 'onbekende afzender' }}"
        tf_raw: "{{ trigger.to_state.attributes.get('new_delivery_timeframe') }}"
        tf_from_iso: >-
          {% if tf_raw is string and '/' in tf_raw %}{{ tf_raw.split('/')[0] }}{% elif tf_raw is mapping %}{{ tf_raw.get('from') or '' }}{% endif %}
        tf_to_iso: >-
          {% if tf_raw is string and '/' in tf_raw %}{{ tf_raw.split('/')[1] }}{% elif tf_raw is mapping %}{{ tf_raw.get('to') or '' }}{% endif %}
        from_time: >-
          {% set d = as_datetime(tf_from_iso, None) %}{{ (d | as_local).strftime('%H:%M') if d else 'onbekend' }}
        to_time: >-
          {% set d = as_datetime(tf_to_iso, None) %}{{ (d | as_local).strftime('%H:%M') if d else 'onbekend' }}
        day_label: >-
          {% set d = as_datetime(tf_from_iso, None) %}
          {% if d %}
            {% set diff = ((d | as_local).date() - now().date()).days %}
            {% if diff == 0 %}vandaag{% elif diff == 1 %}morgen{% elif diff == 2 %}overmorgen{% else %}op {{ (d | as_local).strftime('%d-%m') }}{% endif %}
          {% else %}binnenkort{% endif %}
    - action: tts.speak
      target:
        entity_id: tts.home_assistant_cloud
      data:
        cache: false
        media_player_entity_id: media_player.living_room
        message: "{{ carrier }}-pakket van {{ sender }} wordt {{ day_label }} verwacht tussen {{ from_time }} en {{ to_time }}."

# C) Bezorgd
# Events worden verstuurd nadat de sensoren zijn bijgewerkt, dus
# sensor.dhl_delivered_details bevat het bezorgde pakket al.
- alias: "DHL - bezorgd (NL)"
  id: dhl_delivered_nl
  mode: queued
  max_exceeded: silent
  triggers:
    - trigger: event.received
      target:
        entity_id: event.dhl_parcel_netherlands_dhl_parcel_status_changed
      options:
        event_type: dhl_parcel_status_changed
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.get('new_status') == 'DELIVERED' }}"
  actions:
    - variables:
        carrier: "{{ {'dhl': 'DHL', 'postnl': 'PostNL', 'dragonfly': 'Dragonfly'}.get(trigger.to_state.attributes.get('carrier'), 'DHL') }}"
        sender: "{{ trigger.to_state.attributes.get('sender') or 'onbekende afzender' }}"
        tracking: "{{ trigger.to_state.attributes.get('tracking_code', 'onbekend') }}"
        delivery_location: "{{ trigger.to_state.attributes.get('delivery_location') or 'onbekend' }}"
        details: "{{ (state_attr('sensor.dhl_delivered_details', 'delivered_by_number') or {}).get(tracking, {}) }}"
        delivered_day: "{{ details.get('delivered_day_label') or 'recent' }}"
        delivered_time: >-
          {% set d = as_datetime(trigger.to_state.attributes.get('delivered_at') or '', None) %}{{ details.get('delivered_at_hhmm') or ((d | as_local).strftime('%H:%M') if d else '') }}
    - action: tts.speak
      target:
        entity_id: tts.home_assistant_cloud
      data:
        cache: false
        media_player_entity_id: media_player.living_room
        message: >-
          {{ carrier }}-pakket {{ tracking }} van {{ sender }} is {{ delivered_day }} bezorgd{% if delivered_time %} om {{ delivered_time }}{% endif %}.
          Bezorglocatie: {{ delivery_location }}.

# A1) Nieuw pakket uit een Amazon.nl-bestelling (experimentele Amazon-bron)
- alias: "DHL - nieuw Amazon-pakket (NL)"
  id: dhl_amazon_parcel_nl
  mode: queued
  max_exceeded: silent
  triggers:
    - trigger: event.received
      target:
        entity_id: event.dhl_parcel_netherlands_dhl_parcel_discovered
      options:
        event_type: dhl_parcel_discovered
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.get('source') == 'amazon' }}"
  actions:
    - variables:
        carrier: "{{ {'dhl': 'DHL', 'postnl': 'PostNL', 'dragonfly': 'Dragonfly'}.get(trigger.to_state.attributes.get('carrier'), 'DHL') }}"
        tracking: "{{ trigger.to_state.attributes.get('tracking_code', 'onbekend') }}"
        order_id: "{{ trigger.to_state.attributes.get('order_id') or '' }}"
        status: "{{ trigger.to_state.attributes.get('status_localized') or trigger.to_state.attributes.get('status') or 'onbekend' }}"
    - action: tts.speak
      target:
        entity_id: tts.home_assistant_cloud
      data:
        cache: false
        media_player_entity_id: media_player.living_room
        message: "Nieuw Amazon-pakket {{ tracking }}, bezorgd door {{ carrier }}{% if order_id %}, bestelling {{ order_id }}{% endif %}. Huidige status: {{ status }}."
